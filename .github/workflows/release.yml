name: Release

on:
  push:
    tags: "v*"

jobs:
  build-macos:
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - run: npm ci

      - run: npm run build

      - run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: PinedIn-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: npm ci

      - run: npm run build

      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: PinedIn-linux
          path: src-tauri/target/release/bundle/*/

  create-release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PinedIn-aarch64-apple-darwin/*.dmg
            PinedIn-x86_64-apple-darwin/*.dmg
            PinedIn-linux/**/*.AppImage
            PinedIn-linux/**/*.deb
            PinedIn-linux/**/*.rpm

      - name: Upload to PinedIn-Releases
        env:
          GH_TOKEN: ${{ secrets.PINEDIN_RELEASES_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_REPO="Zarl-prog/PinedIn-Releases"
          gh release delete "$TAG" --repo "$RELEASE_REPO" -y 2>/dev/null || true
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes "Release $TAG" \
            PinedIn-aarch64-apple-darwin/*.dmg \
            PinedIn-x86_64-apple-darwin/*.dmg \
            PinedIn-linux/**/*.AppImage \
            PinedIn-linux/**/*.deb \
            PinedIn-linux/**/*.rpm

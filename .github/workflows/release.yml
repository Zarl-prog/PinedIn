name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PinedIn ${{ github.ref_name }}
          releaseBody: "See changelog for details."
          releaseDraft: false
          prerelease: false

      - name: Upload to public release repo
        env:
          GH_TOKEN: ${{ secrets.PINEDIN_RELEASES_TOKEN }}
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          [ ! -d "$BUNDLE_DIR" ] && echo "No bundle dir" && exit 0

          RELEASE_TAG="${{ github.ref_name }}"
          PUBLIC_REPO="Zarl-prog/PinedIn-Releases"

          # Create the public release if it doesn't exist yet
          gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" &>/dev/null || \
            gh release create "$RELEASE_TAG" \
              --repo "$PUBLIC_REPO" \
              --title "PinedIn $RELEASE_TAG" \
              --notes "See the main repo for changelog."

          # Upload installer files (.exe, .dmg, .AppImage, .deb, .rpm)
          find "$BUNDLE_DIR" -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec gh release upload "$RELEASE_TAG" {} --repo "$PUBLIC_REPO" --clobber \;

          # Upload updater archives â€” v1Compatible generates .tar.gz (macOS/Linux)
          # and .zip (Windows) in bundle/updater/ or alongside bundles
          UPDATER_DIR="$BUNDLE_DIR/updater"
          if [ -d "$UPDATER_DIR" ]; then
            find "$UPDATER_DIR" -type f \( -name "*.tar.gz" -o -name "*.zip" \) \
              -exec gh release upload "$RELEASE_TAG" {} --repo "$PUBLIC_REPO" --clobber \;
            # Upload .sig signature files alongside the archives
            find "$UPDATER_DIR" -type f -name "*.sig" \
              -exec gh release upload "$RELEASE_TAG" {} --repo "$PUBLIC_REPO" --clobber \;
          fi

          # Also look for .sig files alongside installers (for non-v1Compatible)
          find "$BUNDLE_DIR" -type f -name "*.sig" \
            -exec gh release upload "$RELEASE_TAG" {} --repo "$PUBLIC_REPO" --clobber \;

          # Generate latest.json from the updater archives that were uploaded
          echo "Generating latest.json from updater artifacts..."
          PLATFORMS=""
          for f in $(find "$UPDATER_DIR" -type f \( -name "*.tar.gz" -o -name "*.zip" \) 2>/dev/null); do
            BASENAME=$(basename "$f")
            # Extract platform from updater archive filename (Tauri v2 v1Compatible naming)
            case "$BASENAME" in
              *x64-setup.nsis.zip*)  PLAT="windows-x86_64" ;;
              *x64-setup.mui.zip*)   PLAT="windows-x86_64" ;;
              *x86_64-setup.nsis.zip*) PLAT="windows-x86_64" ;;
              *x86_64-setup.mui.zip*) PLAT="windows-x86_64" ;;
              *x86_64.AppImage.tar.gz*) PLAT="linux-x86_64" ;;
              *amd64.AppImage.tar.gz*)  PLAT="linux-x86_64" ;;
              *x86_64.dmg.tar.gz*)    PLAT="darwin-x86_64" ;;
              *aarch64.dmg.tar.gz*)   PLAT="darwin-aarch64" ;;
              *x86_64.app.tar.gz*)    PLAT="darwin-x86_64" ;;
              *aarch64.app.tar.gz*)   PLAT="darwin-aarch64" ;;
              *)                      continue ;;
            esac
            # Read the .sig file that sits right next to the archive
            SIG_FILE="${f}.sig"
            SIGNATURE=""
            [ -f "$SIG_FILE" ] && SIGNATURE=$(cat "$SIG_FILE")
            URL="https://github.com/$PUBLIC_REPO/releases/download/$RELEASE_TAG/$BASENAME"
            PLATFORMS="$PLATFORMS,\"$PLAT\":{\"signature\":\"$SIGNATURE\",\"url\":\"$URL\"}"
          done

          if [ -n "$PLATFORMS" ]; then
            PLATFORMS="{${PLATFORMS:1}}"
            cat > /tmp/latest.json <<EOF
           {
             "version": "$RELEASE_TAG",
             "notes": "See the main repo for changelog.",
             "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
             "platforms": $PLATFORMS
           }
           EOF
            echo "Uploading latest.json..."
            gh release upload "$RELEASE_TAG" /tmp/latest.json \
              --repo "$PUBLIC_REPO" --clobber
          else
            echo "WARNING: No updater archives found â€” latest.json not generated!"
          fi

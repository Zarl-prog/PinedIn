name: Release

on:
  push:
    tags: "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure tag matches tauri.conf.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag version:  $TAG"
          echo "Conf version: $CONF"
          if [ "$TAG" != "$CONF" ]; then
            echo "::error::Tag v$TAG does not match tauri.conf.json version $CONF. Bump the version and re-tag."
            exit 1
          fi

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: npm ci

      - run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc

  build-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - run: npm ci

      - run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-macos:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - run: npm ci

      - run: npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release on PinedIn-Releases
        env:
          GH_TOKEN: ${{ secrets.PINEDIN_RELEASES_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_REPO="Zarl-prog/PinedIn-Releases"

          # Delete existing release if present (idempotent)
          gh release delete "$TAG" --repo "$RELEASE_REPO" -y 2>/dev/null || true

          # Collect all artifacts
          FILES=()
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < <(find . -type f \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.msi" \) -print0)

          # Create single release with all platform artifacts
          gh release create "$TAG" --repo "$RELEASE_REPO" \
            --title "$TAG" \
            --notes "Release $TAG" \
            "${FILES[@]}"
name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libfuse2

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: PinedIn ${{ github.ref_name }}
          releaseBody: "See changelog for details."
          releaseDraft: false
          prerelease: false

      - name: Upload to public release repo
        env:
          GH_TOKEN: ${{ secrets.PINEDIN_RELEASES_TOKEN }}
        shell: bash
        run: |
          # Find installer artifacts generated by tauri-action
          # tauri-action saves artifacts to src-tauri/target/release/bundle/
          BUNDLE_DIR="src-tauri/target/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            # Ensure the public release exists (create if first upload for this tag)
            gh release view "$RELEASE_TAG" --repo PinedIn-App/PinedIn-Releases 2>/dev/null || \
              gh release create "$RELEASE_TAG" \
                --repo PinedIn-App/PinedIn-Releases \
                --title "PinedIn $RELEASE_TAG" \
                --notes "See the main repo for changelog."

            # Upload all installer artifacts (recursive, flatten paths)
            find "$BUNDLE_DIR" -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.tar.xz" \) \
              -exec gh release upload "$RELEASE_TAG" {} \
                --repo PinedIn-App/PinedIn-Releases --clobber \;
          fi

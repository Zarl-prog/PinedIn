<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent !important;
        overflow: hidden;
        font-family: 'Geist Mono', monospace;
      }
      #root {
        background: transparent !important;
        overflow: hidden;
        width: 140px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      :root {
        --pill-bg: #060608;
        --pill-border: #1a1a1a;
        --pill-text: #ffffff;
        --pill-text-muted: #777777;
        --pill-shadow: 0 4px 16px rgba(0,0,0,0.5);
        --card-bg: #ffffff;
        --card-border: #e0e0e0;
        --card-text-primary: #1a1a1a;
        --card-text-muted: #999999;
        --divider: #e0e0e0;
        --btn-done-bg: transparent;
        --btn-done-text: #666666;
        --btn-done-border: #d0d0d0;
        --btn-snooze-bg: transparent;
        --btn-snooze-text: #666666;
        --btn-remind-bg: transparent;
        --btn-remind-text: #666666;
      }

      .dark {
        --pill-bg: #060608;
        --pill-border: #1a1a1a;
        --pill-text: #ffffff;
        --pill-text-muted: #777777;
        --pill-shadow: 0 4px 16px rgba(0,0,0,0.5);
        --card-bg: #080808;
        --card-border: #1a1a1a;
        --card-text-primary: #ffffff;
        --card-text-muted: #777777;
        --divider: #151515;
        --btn-done-bg: transparent;
        --btn-done-text: #aaaaaa;
        --btn-done-border: #222222;
        --btn-snooze-bg: transparent;
        --btn-snooze-text: #aaaaaa;
        --btn-remind-bg: transparent;
        --btn-remind-text: #aaaaaa;
      }

      [data-theme="parchment"] {
        --pill-bg: #5c3d2e;
        --pill-border: #8b6f50;
        --pill-text: #faf6f0;
        --pill-text-muted: #d4b896;
        --pill-shadow: 0 4px 16px rgba(61, 43, 31, 0.4);
        --card-bg: #faf6f0;
        --card-border: #d4b896;
        --card-text-primary: #3d2b1f;
        --card-text-muted: #c4a882;
        --divider: #d4b896;
        --btn-done-bg: rgba(46,125,50,0.12);
        --btn-done-text: #2e7d32;
        --btn-done-border: rgba(46,125,50,0.3);
        --btn-snooze-bg: rgba(245,127,23,0.12);
        --btn-snooze-text: #f57f17;
        --btn-remind-bg: rgba(106,27,154,0.12);
        --btn-remind-text: #6a1b9a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/compact-pill-main.tsx"></script>
  </body>
</html>

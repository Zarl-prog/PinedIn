[package]
name = "pinedin"
version = "0.4.15"
description = "Pinned - Always-on-top focus reminder app"
authors = ["Pinned"]
edition = "2021"

[lib]
name = "pinedin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
# Phone-sync pairing QR. `default-features = false` drops the image/PNG
# backend — the QR is rendered as an SVG string and handed to the frontend.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Local-network address discovery for the pairing QR, and a random pairing token.
local-ip-address = "0.6"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

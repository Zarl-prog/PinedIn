<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
    }
    body { font-family: "Inter", system-ui, sans-serif; }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #000;
    }

    /* Background video — full-bleed, behind everything */
    #bg-video {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
      filter: brightness(0.6) saturate(0.8);
    }

    /* Dark vignette overlay on top of video */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 40%,
        rgba(0,0,0,0.4) 70%,
        rgba(0,0,0,0.7) 100%
      );
    }

    /* Title — centered, fade-in */
    #title-pinedin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #F8FAFC;
      font-size: 96px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-align: center;
      text-shadow: 0 0 40px rgba(99,102,241,0.3);
      opacity: 0;
      filter: blur(12px);
    }

    /* Tagline — below title, appears after title settles */
    #tagline {
      position: absolute;
      top: 66%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #A5B4FC;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
    }

    /* Accent glow — soft indigo behind title */
    #accent-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
    }

    /* Final tagline — "Refuses to let you forget" */
    #tagline-final {
      position: absolute;
      top: 72%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #A5B4FC;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.06em;
      text-align: center;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="10"
    data-width="1920"
    data-height="1080"
  >
    <!-- Background video — plays entire 10s -->
    <video
      id="bg-video"
      src="assets/bg-ambient.mp4"
      data-start="0"
      data-duration="10"
      data-track-index="0"
      muted
      playsinline
      data-media-start="0"
      loop
    ></video>

    <!-- Vignette overlay — fades in with the piece -->
    <div id="vignette" data-start="0" data-duration="10" data-track-index="0"></div>

    <!-- Background music — audio track -->
    <audio
      id="bgm"
      src="assets/bgm-subtle.m4a"
      data-start="0"
      data-duration="10"
      data-track-index="10"
      data-volume="0.25"
    ></audio>

    <!-- Title — "PinedIn" fade-in -->
    <div id="title-pinedin" class="clip" data-start="0" data-duration="2.5" data-track-index="1">
      PinedIn
    </div>

    <!-- Accent glow — behind title -->
    <div id="accent-glow" class="clip" data-start="0" data-duration="2.5" data-track-index="1"></div>

    <!-- Tagline — "The always-on-top task overlay" -->
    <div id="tagline" class="clip" data-start="2.5" data-duration="5" data-track-index="1">
      The always-on-top task overlay
    </div>

    <!-- Final tagline — "Refuses to let you forget" -->
    <div id="tagline-final" class="clip" data-start="7.5" data-duration="2.5" data-track-index="1">
      Refuses to let you forget
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // === Scene 1: 0s – 2.5s — "PinedIn" fade-in ===
    // Accent glow — soft pulse behind
    tl.fromTo("#accent-glow",
      { scale: 0.8, opacity: 0 },
      { scale: 1.0, opacity: 1, duration: 2.0, ease: "power2.out" },
      0
    );
    // Glow settles
    tl.to("#accent-glow",
      { opacity: 0.6, duration: 0.5, ease: "power1.out" },
      2.0
    );

    // Title — blur-in + fade-in
    tl.fromTo("#title-pinedin",
      { opacity: 0, filter: "blur(12px)", y: -20 },
      { opacity: 1, filter: "blur(0px)", y: 0, duration: 1.2, ease: "power3.out" },
      0.4
    );

    // Title settles — subtle lock
    tl.to("#title-pinedin",
      { textShadow: "0 0 30px rgba(99,102,241,0.5)", duration: 0.3 },
      2.0
    );

    // === Scene 2: 2.5s – 7.5s — Tagline ===
    // Title fades out gracefully
    tl.to("#title-pinedin",
      { opacity: 0.0, y: -30, filter: "blur(4px)", duration: 0.6, ease: "power2.in" },
      2.5
    );
    // Accent glow fades
    tl.to("#accent-glow",
      { opacity: 0, scale: 0.9, duration: 0.6 },
      2.5
    );

    // Tagline fades in
    tl.fromTo("#tagline",
      { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" },
      2.8
    );

    // === Scene 3: 7.5s – 10s — Final tagline ===
    // Tagline fades out
    tl.to("#tagline",
      { opacity: 0, y: -15, duration: 0.5, ease: "power2.in" },
      7.5
    );

    // Final tagline fades in with soft rise
    tl.fromTo("#tagline-final",
      { opacity: 0, y: 15 },
      { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" },
      7.8
    );

    // Hold at end
    tl.to("#tagline-final",
      { duration: 0.5 },
      9.5
    );

    window.__timelines["main"] = tl;
  </script>
</body>
</html>

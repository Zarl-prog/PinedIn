<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PinedIn Product Intro</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0B0F1A; }
      body { font-family: "Inter", sans-serif; }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .full-bleed {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(11,15,26,0.85) 100%);
        pointer-events: none;
      }

      .glow-layer {
        position: absolute;
        inset: -300px;
        background: radial-gradient(ellipse at 50% 40%, rgba(99,102,241,0.25) 0%, transparent 65%);
        opacity: 0;
        pointer-events: none;
      }

      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 160px;
      }

      .title-hero {
        font-size: 120px;
        font-weight: 800;
        color: #F8FAFC;
        letter-spacing: -0.03em;
        text-align: center;
        opacity: 0;
      }

      .title-hero .accent {
        color: #A5B4FC;
      }

      .tagline {
        font-size: 40px;
        font-weight: 400;
        color: #94A3B8;
        letter-spacing: 0.02em;
        text-align: center;
        opacity: 0;
        margin-top: 24px;
      }

      .tagline strong {
        font-weight: 600;
        color: #A5B4FC;
      }

      .resolve-line {
        font-size: 44px;
        font-weight: 600;
        color: #818CF8;
        letter-spacing: 0.04em;
        text-align: center;
        opacity: 0;
        margin-top: 80px;
      }

      .ghost-text {
        position: absolute;
        font-size: 280px;
        font-weight: 800;
        color: #6366F1;
        opacity: 0.04;
        letter-spacing: -0.04em;
        pointer-events: none;
        user-select: none;
      }

      .ghost-text-1 {
        bottom: -40px;
        right: -40px;
      }

      .ghost-text-2 {
        top: -60px;
        left: -60px;
        font-size: 200px;
        opacity: 0.03;
      }

      .accent-line {
        position: absolute;
        height: 2px;
        background: linear-gradient(90deg, transparent, #6366F1, transparent);
        opacity: 0;
      }

      .accent-line-top {
        top: 120px;
        left: 15%;
        right: 15%;
      }

      .accent-line-bottom {
        bottom: 140px;
        left: 20%;
        right: 20%;
      }

      .corner-bracket {
        position: absolute;
        width: 40px;
        height: 40px;
        border-color: rgba(99,102,241,0.15);
        border-style: solid;
        opacity: 0;
      }

      .corner-bracket-tl { top: 60px; left: 60px; border-width: 2px 0 0 2px; }
      .corner-bracket-tr { top: 60px; right: 60px; border-width: 2px 2px 0 0; }
      .corner-bracket-bl { bottom: 60px; left: 60px; border-width: 0 0 2px 2px; }
      .corner-bracket-br { bottom: 60px; right: 60px; border-width: 0 2px 2px 0; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="10"
    >
      <!-- Background video (muted, framework-owned) -->
      <video
        id="bg-video"
        src="assets/bg-ambient.mp4"
        class="full-bleed clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- Dark vignette overlay -->
      <div id="vignette" class="vignette clip" data-start="0" data-duration="10" data-track-index="1"></div>

      <!-- Ambient glow behind hero -->
      <div id="glow" class="glow-layer clip" data-start="0" data-duration="10" data-track-index="2"></div>

      <!-- Ghost text decoratives -->
      <div id="ghost-1" class="ghost-text ghost-text-1 clip" data-start="0" data-duration="10" data-track-index="3">PINEDIN</div>
      <div id="ghost-2" class="ghost-text ghost-text-2 clip" data-start="0" data-duration="10" data-track-index="4">ALWAYS ON TOP</div>

      <!-- Accent lines -->
      <div id="line-top" class="accent-line accent-line-top clip" data-start="0" data-duration="10" data-track-index="5"></div>
      <div id="line-bottom" class="accent-line accent-line-bottom clip" data-start="0" data-duration="10" data-track-index="6"></div>

      <!-- Corner brackets -->
      <div class="corner-bracket corner-bracket-tl clip" id="bracket-tl" data-start="0" data-duration="10" data-track-index="7"></div>
      <div class="corner-bracket corner-bracket-tr clip" id="bracket-tr" data-start="0" data-duration="10" data-track-index="8"></div>
      <div class="corner-bracket corner-bracket-bl clip" id="bracket-bl" data-start="0" data-duration="10" data-track-index="9"></div>
      <div class="corner-bracket corner-bracket-br clip" id="bracket-br" data-start="0" data-duration="10" data-track-index="10"></div>

      <!-- BGM separate audio element -->
      <audio
        id="bgm"
        src="assets/bgm-subtle.m4a"
        data-start="0"
        data-duration="10"
        data-track-index="11"
        data-volume="0.3"
      ></audio>

      <!-- Scene 1: Hook — "PinedIn" hero title -->
      <section class="scene clip" id="scene-hook" data-start="0" data-duration="2.5" data-track-index="12">
        <h1 id="hero-title" class="title-hero">
          Pined<span class="accent">In</span>
        </h1>
      </section>

      <!-- Scene 2: Build — Tagline -->
      <section class="scene clip" id="scene-build" data-start="2.5" data-duration="5" data-track-index="12">
        <p id="tagline-text" class="tagline">
          The <strong>always-on-top</strong> task overlay
        </p>
      </section>

      <!-- Scene 3: Resolve — Closing lock -->
      <section class="scene clip" id="scene-resolve" data-start="7.5" data-duration="2.5" data-track-index="12">
        <p id="resolve-text" class="resolve-line">
          Refuses to let you forget
        </p>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ── Ambient glow bloom ──
      tl.fromTo("#glow",
        { opacity: 0, scale: 0.85 },
        { opacity: 0.3, scale: 1, duration: 1.2, ease: "power2.out" },
        0
      );

      // ── Accent lines draw in ──
      tl.fromTo("#line-top",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.3
      );
      tl.fromTo("#line-bottom",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.5
      );

      // ── Corner brackets ──
      tl.fromTo("#bracket-tl", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.4);
      tl.fromTo("#bracket-tr", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.5);
      tl.fromTo("#bracket-bl", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6);
      tl.fromTo("#bracket-br", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.7);

      // ── Ghost text ambient fade ──
      tl.fromTo("#ghost-1",
        { opacity: 0, y: 30 },
        { opacity: 0.04, y: 0, duration: 1.5, ease: "power2.out" },
        0.2
      );
      tl.fromTo("#ghost-2",
        { opacity: 0, x: -30 },
        { opacity: 0.03, x: 0, duration: 1.8, ease: "power2.out" },
        0.4
      );

      // ── Scene 1: Hook — "PinedIn" ──
      tl.fromTo("#hero-title",
        { opacity: 0, y: 40, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "power3.out" },
        0.4
      );

      // ── Scene 2: Build — Tagline ──
      tl.fromTo("#tagline-text",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
        2.7
      );

      // ── Scene 3: Resolve — Final line ──
      tl.fromTo("#resolve-text",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
        7.8
      );

      // ── BGM subtle fade out at end ──
      tl.to("#bgm", { volume: 0, duration: 1.2, ease: "power1.in" }, 8.8);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
